<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 20px 60px 20px; background-color: #f9fafb;">
    <div style="background: white; width: 100%; max-width: 480px; padding: 35px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e5e7eb;">
        <h2 style="text-align: center; font-size: 24px; margin-bottom: 25px; font-weight: 800; color: #111827;">Nueva Actividad</h2>
        
        <form id="formActividad" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            
            <!-- Nombre -->
            <div style="grid-column: span 2;">
                <label style="font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 5px; display: block;">Nombre de la actividad *</label>
                <input type="text" id="nombre" required placeholder="Ej. Tarea de Termodinámica" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; box-sizing: border-box; font-size: 14px;">
            </div>

            <!-- Materia -->
            <div style="grid-column: span 2;">
                <label style="font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 5px; display: block;">Materia *</label>
                <input type="text" id="materia" required placeholder="Ej. Cálculo Diferencial" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; box-sizing: border-box; font-size: 14px;">
            </div>

            <!-- Tipo -->
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 5px; display: block;">Tipo *</label>
                <select id="tipoActividad" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; background: white; outline: none; box-sizing: border-box; font-size: 14px;">
                    <option value="Tarea">Tarea</option>
                    <option value="Examen">Examen</option>
                    <option value="Proyecto">Proyecto</option>
                    <option value="Presentación">Presentación</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <!-- Fecha -->
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 5px; display: block;">Entrega *</label>
                <input type="date" id="fecha" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; box-sizing: border-box; font-size: 14px;">
            </div>

            <!-- Dificultad (1-5) -->
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 5px; display: block;">Dificultad (1-5)</label>
                <input type="number" id="dificultad" min="1" max="5" value="3" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; box-sizing: border-box; font-size: 14px;">
            </div>

            <!-- Tiempo Estimado -->
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 5px; display: block;">Tiempo estimado</label>
                <input type="text" id="tiempo" placeholder="Ej. 2 horas" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; box-sizing: border-box; font-size: 14px;">
            </div>

            <!-- Contenido -->
            <div style="grid-column: span 2;">
                <label style="font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 5px; display: block;">Utilidad del contenido</label>
                <select id="calificacion" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; background: white; outline: none; box-sizing: border-box; font-size: 14px;">
                    <option value="muy">Muy útil</option>
                    <option value="medio">Interesante</option>
                    <option value="poco">Poco relevante</option>
                </select>
            </div>

            <!-- Equipo -->
            <div style="grid-column: span 2;">
                <label style="font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 5px; display: block;">Equipo (opcional)</label>
                <input type="text" id="equipo" placeholder="Nombre del equipo" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; box-sizing: border-box; font-size: 14px;">
            </div>

            <!-- Descripción -->
            <div style="grid-column: span 2;">
                <label style="font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 5px; display: block;">Descripción (opcional)</label>
                <textarea id="descripcion" rows="2" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; box-sizing: border-box; resize: none; font-size: 14px;"></textarea>
            </div>

            <!-- Importancia (Automatizada con umbral para BAJA) -->
            <div style="grid-column: span 2; background: #f8fafc; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0;">
                <span style="font-size: 13px; font-weight: 700; color: #64748b;">Importancia:</span>
                <span id="importanciaDisplay" style="font-size: 18px; font-weight: 900; color: #16a34a;">BAJA</span>
            </div>

            <button type="submit" style="grid-column: span 2; background: #000; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 5px;">Guardar Actividad</button>
        </form>
    </div>
</main>

<script>
    const camposCriterio = ['tipoActividad', 'dificultad'];
    
    const actualizarNE = () => {
        const tipo = document.getElementById('tipoActividad').value;
        const difPuntuacion = parseInt(document.getElementById('dificultad').value) || 1; // P1
        const display = document.getElementById('importanciaDisplay');

        // --- FÓRMULA OFICIAL SERENO (PROMEDIO PONDERADO) ---
        
        // Factor 1: Dificultad (P1 = 1-5, W1 = Peso 5)
        const p1 = difPuntuacion;
        const w1 = 5;

        // Factor 2: Tipo (P2: Examen=5, Tarea=2, W2 = Peso 4)
        const p2 = (tipo === 'Examen' || tipo === 'Proyecto') ? 5 : 2;
        const w2 = 4;

        // NE = [ (P1*W1 + P2*W2) / (W1+W2) ] * 20
        const ne = ((p1 * w1) + (p2 * w2)) / (w1 + w2) * 20;

        // Visualización del resultado
        if (ne >= 70) {
            display.innerText = 'ALTA';
            display.style.color = '#dc2626';
        } else if (ne >= 40) {
            display.innerText = 'MEDIA';
            display.style.color = '#d97706';
        } else {
            display.innerText = 'BAJA';
            display.style.color = '#16a34a';
        }
    };

    camposCriterio.forEach(id => document.getElementById(id).addEventListener('change', actualizarNE));
    document.getElementById('dificultad').addEventListener('input', actualizarNE);
</script>
